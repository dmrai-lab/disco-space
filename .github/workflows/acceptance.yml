# The acceptance test as a Hugging Face Job on an L4 (GitHub runners have no GPU): the commit is deployed to the
# staging Space, whose image the Job runs (tools/deploy.py, tools/gate_job.py). A run is paid, so it runs at release
# (called by deploy.yml before the Space is deployed) or by hand. Needs the repository secret HF_TOKEN (an account with
# Jobs enabled and write access to the staging Space) and, optionally, the variable DISCO_STAGING_SPACE (default
# rfick/disco-staging).
name: acceptance
on:
  workflow_call: {}
  workflow_dispatch: {}

concurrency:
  group: acceptance-l4
  cancel-in-progress: false

jobs:
  l4:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install "huggingface_hub>=1.0"
      - name: the acceptance test on an L4 Job
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          STAGING: ${{ vars.DISCO_STAGING_SPACE || 'rfick/disco-staging' }}
        run: |
          test -n "$HF_TOKEN" || { echo "no HF_TOKEN secret: the acceptance test cannot run"; exit 1; }
          python tools/deploy.py --sha ${{ github.sha }} --space "$STAGING"
          python tools/gate_job.py --space "$STAGING"
