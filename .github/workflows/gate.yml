# The gate: the CPU tests on the runner, on every pull request and push to main (free). The acceptance test is a paid
# Hugging Face Job on an L4 and runs at release, before the deploy (acceptance.yml).
name: gate
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  cpu:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: install the stack without CUDA
        run: |
          sed -e 's/^jax\[cuda12\]==/jax==/' requirements.txt > r.txt
          pip install pytest -r r.txt
      # every test file but the acceptance (tests/test_acceptance.py runs on an L4 Job at release, acceptance.yml); the
      # tests that need data or a fixture skip themselves when it is absent
      - run: JAX_PLATFORMS=cpu pytest tests -q --ignore=tests/test_acceptance.py

