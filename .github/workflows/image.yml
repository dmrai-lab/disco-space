# The base image: the pinned stack built once per change to requirements.txt / Dockerfile.base and pushed to
# ghcr.io/dmrai-lab/disco-space, tagged with the commit sha and `latest`. The package must be PUBLIC on GHCR for
# Hugging Face to pull it (set once in the package's settings after the first push).
name: image
on:
  push:
    branches: [main]
    paths: [requirements.txt, Dockerfile.base, .github/workflows/image.yml]
  workflow_dispatch:

jobs:
  base:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.base
          push: true
          tags: |
            ghcr.io/dmrai-lab/disco-space:${{ github.sha }}
            ghcr.io/dmrai-lab/disco-space:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
