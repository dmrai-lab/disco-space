# The DiSCo Space: what is pinned. Every number the app shows comes from pipeline.py on this configuration.

[data]
repo = "SubstrateCommons/disco-replay"          # the public replay dataset
moments = "disco/moments"                        # the shape-moment layout written by dmipy-sim's write_shape_moments
revision = "8d6e588fcffddb120b312da5191d5457fb0d44d7"   # the dataset revision the layout is read at
source_manifest_sha256 = "499e411b7f7412ffa72a8885ee22a7bed9198e992a517b81c273ceeaeafd629e"   # the columnar manifest the layout was contracted from (its manifest.json names it)

# The timing classes ("shapes") the layout holds: square pulses (slew_rate = inf) at TE = 53.5 ms, PGSE unless
# kind = "pgste" (a stimulated echo storing for TM = Delta - delta). delta / Delta / TE in seconds, the same numbers the
# layout's manifest records (checked at load); label is what the app shows.
[shapes."d10.2-D16.7"]
label = "DiSCo δ 10.2 / Δ 16.7 ms (shells b = 0, 1000, 1925)"
delta = 0.0102
Delta = 0.0167
TE = 0.0535
[shapes."d7.6-D45.9"]
label = "DiSCo δ 7.6 / Δ 45.9 ms (shell b = 3091)"
delta = 0.0076
Delta = 0.0459
TE = 0.0535
[shapes."d17.7-D35.8"]
label = "DiSCo δ 17.7 / Δ 35.8 ms (shell b = 13183)"
delta = 0.0177
Delta = 0.0358
TE = 0.0535
[shapes."d12-D24"]
label = "clinical δ 12 / Δ 24 ms"
delta = 0.012
Delta = 0.024
TE = 0.0535
[shapes."d17-D30"]
label = "research δ 17 / Δ 30 ms"
delta = 0.017
Delta = 0.030
TE = 0.0535
[shapes."d8-D20"]
label = "Connectome 2.0 δ 8 / Δ 20 ms"
delta = 0.008
Delta = 0.020
TE = 0.0535
# The stimulated echo matched to DiSCo's b = 3091 shell: the same diffusion time (Delta = delta + TM = 45.9 ms) with
# the magnetisation stored along z for TM, so susceptibility dephasing (and T2) act only during the two deltas.
[shapes."ste-d7.6-TM38.3"]
label = "stimulated echo δ 7.6 / TM 38.3 ms (Δ 45.9 ms, the PGSTE twin of the b = 3091 class)"
delta = 0.0076
Delta = 0.0459
TE = 0.0535
kind = "pgste"

# DiSCo's own protocol: which timing class each shell of the dataset's gradient table plays (b in s/mm^2, the
# table's rows are assigned to the nearest b here).
[disco]
shells = [
  { b = 0, shape = "d10.2-D16.7" },
  { b = 1000, shape = "d10.2-D16.7" },
  { b = 1925, shape = "d10.2-D16.7" },
  { b = 3091, shape = "d7.6-D45.9" },
  { b = 13183, shape = "d17.7-D35.8" },
]

# Presets the app offers besides "DiSCo 364" (which comes from the dataset's table). b in s/mm^2.
[presets."clinical b1000 x 30"]
n_b0 = 1
shells = [{ shape = "d12-D24", b = 1000, n_dirs = 30 }]
[presets."research 3-shell x 90"]
n_b0 = 3
shells = [
  { shape = "d17-D30", b = 1000, n_dirs = 90 },
  { shape = "d17-D30", b = 2000, n_dirs = 90 },
  { shape = "d17-D30", b = 3000, n_dirs = 90 },
]
[presets."Connectome 2.0 b6000 x 60"]
n_b0 = 2
shells = [{ shape = "d8-D20", b = 6000, n_dirs = 60 }]

# The tissue and the scanner: the field presets the page offers (T), the default field,
# and whether a run starts with the tiers on. Tissue defaults come from dmipy-sim's white-matter catalogue at the
# nearest cited field (1.5 / 3 / 7 T) and are editable on the page.
[physics]
fields = [0.064, 1.5, 3.0, 7.0, 11.7]
default_field = 3.0
default_on = true

# The mode: demo = the prebaked shape-moment layout (the hosted Spaces; seconds; the stored pulse
# timings), full = the columnar replay pack itself (minutes per volume; any timing; the scheme upload), read from
# DISCO_COLUMNS (a directory with the columns, or the Hub at 45 MB/s). DISCO_MODE in the environment overrides.
[mode]
mode = "demo"
columns = "hf://SubstrateCommons/disco-replay/disco"
workers = 16

# The compute backend: jax (the reference; the Docker Space) or torch (Hugging Face's shared GPU pool, disco-space#2);
# DISCO_BACKEND in the environment overrides. resident = false rebuilds the layout's device tensors on every call
# (a pool that drops the device between calls).
[compute]
backend = "jax"
resident = true

[tracking]
density = 4          # seeds per region voxel = density^3 (4 -> 659,840 seeds, the DiSCo score's setting)
step_mm = 0.5
max_angle = 30.0
max_steps = 500

# The acceptance gate (tests/test_acceptance.py) on the DiSCo 364 protocol, noiseless.
[gate]
pearson_count_min = 0.90
missed_pairs_max = 0
reference_max_abs_diff = 1e-3     # the replay of DiSCo 364 against disco/reference/disco_replay_bare.nii.gz
